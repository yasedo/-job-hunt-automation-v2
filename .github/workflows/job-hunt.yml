name: Job Hunt Collector

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and score jobs without writing to Airtable"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: job-hunt-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect jobs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appzNZgfYlDQnSZqG
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node src/collector.mjs
